services:
  - type: web
    name: relay-trade-demo
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRADING_MODE
        value: paper
      - key: ALLOW_LIVE_TRADING
        value: "false"
      - key: BYBIT_TESTNET
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: LIVE_CONFIRMATION_CODE
        sync: false
