<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font:16px system-ui;background:#0b1020;color:#edf3ff;margin:0;padding:20px}main{max-width:520px;margin:auto}.card{background:#151e33;border:1px solid #283858;border-radius:14px;padding:16px;margin:14px 0}select,input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:0;border-radius:9px;font-size:15px}select,input{background:#202c45;color:white}button{background:#628cff;color:white;font-weight:bold}.muted{color:#a8b4cd}.warn{color:#ffd37c}.hidden{display:none}</style></head><body><main><p class="muted">DEMO FUTURES · RESEARCH TICKET</p><h1>Choose leverage</h1><p class="muted">The exchange decides what is available. This screen only validates futures rules; trade placement is not enabled yet.</p><div class="card"><select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option></select><button onclick="rules()">Check available leverage</button><div id="details" class="hidden"><p id="range"></p><label>Leverage</label><select id="leverage"></select><p id="note" class="warn"></p></div></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();const H=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});async function rules(){try{let r=await fetch('/api/futures/leverage-options',{method:'POST',headers:H(),body:JSON.stringify({symbol:symbol.value})}),d=await r.json();if(!r.ok)throw Error(d.detail);details.classList.remove('hidden');range.textContent=`${d.symbol}: ${d.min_leverage}× to ${d.max_leverage}× in ${d.leverage_step}× steps`;leverage.innerHTML='';let min=+d.min_leverage,max=+d.max_leverage,step=+d.leverage_step;for(let x=min;x<=max&&x<=100;x+=step){let o=document.createElement('option');o.value=x;o.textContent=`${x}×`;leverage.append(o)}note.textContent=`Tick size: ${d.tick_size}; minimum quantity: ${d.min_qty}. 100×, when available, carries extreme liquidation risk.`}catch(e){tg?.showPopup?tg.showPopup({message:e.message}):alert(e.message)}}</script></body></html>
