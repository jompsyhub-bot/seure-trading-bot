<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font:16px system-ui;background:#0b1020;color:#edf3ff;margin:0;padding:18px}main{max-width:540px;margin:auto}.card{background:#151e33;border:1px solid #283858;border-radius:14px;padding:15px;margin:13px 0}select,input,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:0;border-radius:9px;font-size:15px}select,input{background:#202c45;color:white}button{background:#628cff;color:white;font-weight:bold}.danger{background:#c75161}.muted{color:#a8b4cd}.good{color:#76e0ad}.loss{color:#ff8997}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;text-align:left;border-bottom:1px solid #283858}.mini{width:auto;padding:6px;font-size:12px;margin:0}.price{font-size:24px;font-weight:800}.feed{display:flex;justify-content:space-between;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a8b4cd;margin-right:5px}.dot.on{background:#76e0ad}
</style></head>
<body><main>
<p class="muted">OKX DEMO · FUTURES TICKET</p><h1>Perpetuals</h1>
<div class="card feed"><div><span id="feedDot" class="dot"></span><span id="feedState" class="muted">Connecting live feed…</span></div><div><div id="priceSymbol" class="muted">BTC-USDT-SWAP</div><div id="livePrice" class="price">—</div></div></div>
<div class="card"><h2>Account readiness</h2><button onclick="account()">Check account & position mode</button><p id="accountText" class="good"></p><select id="positionMode"><option value="net_mode">Net mode</option><option value="long_short_mode">Long/short mode</option></select><button onclick="setMode()">Set Demo position mode</button></div>
<div class="card"><h2>Order plan</h2><select id="symbol" onchange="subscribeTicker()"><option>BTCUSDT</option><option>ETHUSDT</option></select><button onclick="rules()">Load live contract rules</button><p id="range" class="good"></p><div id="ticket" class="hidden"><div class="grid"><select id="side"><option value="long">Long</option><option value="short">Short</option></select><select id="leverage"></select></div><input id="margin" inputmode="decimal" value="1" placeholder="Margin USDT"><button onclick="preview()">Calculate live preview</button><div id="protection" class="hidden"><div class="grid"><input id="tp" inputmode="decimal" placeholder="Take-profit price"><input id="sl" inputmode="decimal" placeholder="Stop-loss price"></div><button class="danger" onclick="place()">Confirm & place Demo order</button></div></div></div>
<div id="result" class="card hidden"></div><div class="card"><h2>Active trades & bot history</h2><p class="muted">Updates immediately after an OKX Demo private-feed event, with a five-second recovery refresh.</p><button onclick="loadPortfolio()">Refresh now</button><div id="portfolioOutput" class="muted">Loading…</div></div>
</main><script>
const tg=window.Telegram?.WebApp;tg?.ready();let orderKey='',busy=false,latestPrice=null,appSocket=null,appKeepalive=null,appRetry=null;
const H=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});
const n=x=>Number(x||0).toFixed(2);const instrument=()=>symbol.value==='BTCUSDT'?'BTC-USDT-SWAP':'ETH-USDT-SWAP';
function say(x){tg?.showPopup?tg.showPopup({message:x}):alert(x)}
async function req(u,m='GET',b){let r=await fetch(u,{method:m,headers:H(),body:b?JSON.stringify(b):undefined}),d;try{d=await r.json()}catch{throw Error(`Server error ${r.status}`)}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function showPrice(value){latestPrice=value;livePrice.textContent=`${n(value)} USDT`;priceSymbol.textContent=instrument();const previewPrice=document.getElementById('previewPrice');if(previewPrice)previewPrice.textContent=`${n(value)} USDT`}
function subscribeTicker(){latestPrice=null;livePrice.textContent='—';priceSymbol.textContent=instrument();feedDot.classList.remove('on');feedState.textContent='Switching live price…';if(appSocket?.readyState===WebSocket.OPEN)appSocket.send(JSON.stringify({type:'subscribe_ticker',instrument:instrument()}))}
function connectAppFeed(){clearTimeout(appRetry);if(!tg?.initData)return;const proto=location.protocol==='https:'?'wss':'ws';feedState.textContent='Connecting secure feed…';try{appSocket=new WebSocket(`${proto}://${location.host}/ws/futures`);appSocket.onopen=()=>{appSocket.send(JSON.stringify({type:'authenticate',init_data:tg.initData}));clearInterval(appKeepalive);appKeepalive=setInterval(()=>appSocket?.readyState===WebSocket.OPEN&&appSocket.send(JSON.stringify({type:'keepalive'})),25000)};appSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='connected')subscribeTicker();if(m.type==='portfolio_changed')loadPortfolio();if(m.type==='ticker'){showPrice(m.price);feedDot.classList.add('on');feedState.textContent='Live OKX Demo price'}}catch{}};appSocket.onclose=()=>{clearInterval(appKeepalive);feedDot.classList.remove('on');feedState.textContent='Secure feed reconnecting…';appRetry=setTimeout(connectAppFeed,3000)}}catch{appRetry=setTimeout(connectAppFeed,3000)}}
async function account(){try{let d=await req('/api/futures/account');accountText.textContent=`${d.account_mode} · ${d.position_mode}`;positionMode.value=d.position_mode;positionMode.disabled=!d.can_change_position_mode}catch(e){say(e.message)}}
async function setMode(){if(!confirm(`Set OKX Demo position mode to ${positionMode.value}?`))return;try{say((await req('/api/futures/position-mode','POST',{position_mode:positionMode.value})).message);account()}catch(e){say(e.message)}}
async function rules(){try{let d=await req('/api/futures/leverage-options','POST',{symbol:symbol.value});ticket.classList.remove('hidden');range.textContent=`${d.instrument}: 1×–${d.max_leverage}× · min ${d.min_contracts} contract(s)`;leverage.innerHTML='';for(let x=1;x<=Math.min(+d.max_leverage,100);x++)leverage.add(new Option(`${x}×`,x))}catch(e){say(e.message)}}
async function preview(){try{let d=await req('/api/futures/preview','POST',{symbol:symbol.value,side:side.value,leverage:+leverage.value,margin_usdt:margin.value});protection.classList.remove('hidden');result.classList.remove('hidden');result.innerHTML=`<h2>Live preview · no order placed</h2><p><strong>Current OKX price</strong> <span id="previewPrice">${n(latestPrice||d.mark_price)} USDT</span></p><p>Contracts: ${d.contracts}</p><p>Exposure: ${n(d.estimated_notional_usdt)} USDT · Margin: ${n(d.estimated_initial_margin_usdt)} USDT</p><p>Available: ${n(d.available_usdt)} USDT · Recommended ceiling: ${n(d.maximum_recommended_margin_usdt)} USDT</p>`}catch(e){say(e.message)}}
async function place(){if(!tp.value||!sl.value)return say('TP and SL are required.');if(!orderKey)orderKey=crypto.randomUUID().replaceAll('-','').slice(0,28);if(!confirm(`Place ONE OKX DEMO ${side.value.toUpperCase()} market order?\nTP ${tp.value} · SL ${sl.value}`))return;try{let d=await req('/api/futures/demo-order','POST',{symbol:symbol.value,side:side.value,leverage:+leverage.value,margin_usdt:margin.value,take_profit:tp.value,stop_loss:sl.value,client_order_id:orderKey,confirmation:'PLACE_DEMO_ORDER'});result.innerHTML=`<h2>Demo order accepted</h2><p>${d.order_id} · ${d.status}</p>`;orderKey='';loadPortfolio()}catch(e){say(e.message)}}
async function closePosition(inst,side){if(!confirm(`Close the entire ${side} position for ${inst} at market on OKX DEMO?`))return;try{let d=await req('/api/futures/close-position','POST',{instrument:inst,position_side:side,confirmation:'CLOSE_DEMO_POSITION'});say(`Close accepted. Realized P&L: ${n(d.realized_pnl_usdt)} USDT`);loadPortfolio()}catch(e){say(e.message)}}
function pnl(v){return `<span class="${Number(v||0)<0?'loss':'good'}">${n(v)} USDT</span>`}
async function loadPortfolio(){if(busy)return;busy=true;try{let d=await req('/api/portfolio'),p=d.active_positions,h=d.bot_trade_history;let active=p.length?`<table><tr><th>Market</th><th>Live P&L</th><th></th></tr>${p.map(x=>`<tr><td>${x.instrument}<br><span class="muted">${x.side} · ${x.contracts} cts · ${x.leverage}×<br>Entry ${n(x.entry_price)} · Mark ${n(x.mark_price)}</span></td><td>${pnl(x.unrealized_pnl)}</td><td><button class="danger mini" onclick="closePosition('${x.instrument}','${x.side}')">Close</button></td></tr>`).join('')}</table>`:'No active OKX Demo positions.';let history=h.length?`<table><tr><th>Trade</th><th>Fill / status</th><th>Realized P&L</th></tr>${h.map(x=>`<tr><td>${x.symbol}<br><span class="muted">${x.side}</span></td><td>${x.status}<br><span class="muted">${n(x.fill_price)} · ${x.quantity||'0'} cts</span></td><td>${pnl(x.realized_pnl)}</td></tr>`).join('')}</table>`:'No bot-originated orders yet.';portfolioOutput.innerHTML=`<h3>Active positions (${p.length})</h3>${active}<h3>Bot trade history</h3>${history}`}catch(e){portfolioOutput.textContent=e.message}finally{busy=false}}
connectAppFeed();loadPortfolio();setInterval(loadPortfolio,5000);
</script></body></html>
